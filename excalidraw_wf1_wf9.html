<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WF1 + WF9 — Temporal + Application Excalidraw</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;margin:0}
h1{color:#7c3aed;font-size:1.4rem;margin-bottom:6px;text-align:center}
p{color:#94a3b8;margin-bottom:20px;text-align:center;font-size:.95rem}
button{background:#7c3aed;color:#fff;border:none;padding:13px 32px;
  font-size:1rem;border-radius:8px;cursor:pointer;margin-bottom:8px}

.note{color:#64748b;font-size:.82rem;text-align:center;max-width:520px}
</style>
</head>
<body>
<h1>WF1 + WF9 — Temporal + Application Workflow</h1>
<p>Updated WF1 (with quota-full check) + New WF9 (Parking Quota Full — Denial &amp; Override)</p>
<button onclick="go()">Download Excalidraw File</button>
<div class="note">
  Open excalidraw.com → Drag &amp; Drop the downloaded .excalidraw file → Press <b>Ctrl+Shift+H</b> to fit screen
</div>

<script>
// ─── ID COUNTER ───────────────────────────────────────
let _id = 1;
const nid = () => 'n' + (_id++);
const ELS = [];

// ─── COLORS ──────────────────────────────────────────
const C = {
  act:   {bg:'#0c2340', sk:'#0284c7', fg:'#bae6fd'},
  dec:   {bg:'#2d1b00', sk:'#d97706', fg:'#fde68a'},
  timer: {bg:'#1c1304', sk:'#ca8a04', fg:'#fef08a'},
  alert: {bg:'#450a0a', sk:'#dc2626', fg:'#fecaca'},
  start: {bg:'#1e1b4b', sk:'#6366f1', fg:'#c7d2fe'},
  ok:    {bg:'#052e16', sk:'#16a34a', fg:'#bbf7d0'},
  trig:  {bg:'#1e0030', sk:'#7c3aed', fg:'#ddd6fe'},
  ref:   {bg:'#1e0030', sk:'#7c3aed', fg:'#e9d5ff'},
  appG:  {bg:'#052e16', sk:'#059669', fg:'#bbf7d0'},
  appR:  {bg:'#450a0a', sk:'#dc2626', fg:'#fecaca'},
  appW:  {bg:'#431407', sk:'#d97706', fg:'#fed7aa'},
  appB:  {bg:'#0c4a6e', sk:'#0284c7', fg:'#e0f2fe'},
  frame1:{sk:'#6366f1', fg:'#818cf8'},
  frame9:{sk:'#a855f7', fg:'#c084fc'},
  hdrT:  {bg:'#1e1b4b', sk:'#6366f1', fg:'#c7d2fe'},
  hdrA:  {bg:'#0c4a6e', sk:'#0284c7', fg:'#bae6fd'},
  note:  {bg:'#172033', sk:'#334155', fg:'#94a3b8'},
};

// ─── PRIMITIVES ──────────────────────────────────────
function pushRect(x,y,w,h,bg,sk,dashed,rounded){
  const id=nid();
  ELS.push({
    id, type:'rectangle', x, y, width:w, height:h,
    backgroundColor:bg, strokeColor:sk, strokeWidth:2,
    roughness:0, fillStyle:'solid',
    strokeStyle: dashed?'dashed':'solid',
    strokeSharpness:'sharp',
    roundness: rounded===false ? null : {type:3,value:8},
    angle:0, opacity:100, boundElements:[],
    seed:_id*13, version:1, versionNonce:1,
    isDeleted:false, updated:1, link:null, locked:false
  });
  return id;
}

function pushDiamond(x,y,w,h,bg,sk){
  const id=nid();
  ELS.push({
    id, type:'diamond', x, y, width:w, height:h,
    backgroundColor:bg, strokeColor:sk, strokeWidth:2,
    roughness:0, fillStyle:'solid',
    strokeStyle:'solid', strokeSharpness:'sharp', roundness:null,
    angle:0, opacity:100, boundElements:[],
    seed:_id*13, version:1, versionNonce:1,
    isDeleted:false, updated:1, link:null, locked:false
  });
  return id;
}

function pushText(x,y,w,h,text,fg,sz){
  const id=nid();
  ELS.push({
    id, type:'text', x, y, width:w, height:h,
    text, rawText:text, originalText:text,
    fontSize:sz||12, fontFamily:1,
    textAlign:'center', verticalAlign:'middle',
    baseline:10, lineHeight:1.4,
    strokeColor:fg, backgroundColor:'transparent',
    strokeWidth:1, strokeStyle:'solid', strokeSharpness:'sharp',
    roughness:0, fillStyle:'solid',
    angle:0, opacity:100, boundElements:[],
    seed:1, version:1, versionNonce:1,
    isDeleted:false, updated:1, link:null, locked:false
  });
  return id;
}

function pushArrow(x1,y1,x2,y2,color,lbl){
  const id=nid();
  ELS.push({
    id, type:'arrow',
    x:x1, y:y1,
    points:[[0,0],[x2-x1,y2-y1]],
    width:Math.abs(x2-x1), height:Math.abs(y2-y1),
    strokeColor:color||'#64748b', backgroundColor:'transparent',
    strokeWidth:2, strokeStyle:'solid', strokeSharpness:'round',
    roughness:0, fillStyle:'solid',
    angle:0, opacity:100, boundElements:[],
    seed:_id*7, version:1, versionNonce:1,
    isDeleted:false, updated:1, link:null, locked:false,
    startBinding:null, endBinding:null,
    lastCommittedPoint:null, startArrowhead:null, endArrowhead:'arrow'
  });
  if(lbl){
    const mx=x1+(x2-x1)*0.5-35, my=y1+(y2-y1)*0.5-9;
    pushText(mx,my,70,18,lbl,'#fbbf24',10);
  }
}

// ─── HIGH-LEVEL HELPERS ──────────────────────────────
// box: returns { x,y,w,h, T(top center), B(bot center), L, R, C }
function box(c,x,y,w,h,text,dashed){
  pushRect(x,y,w,h,c.bg,c.sk,dashed);
  pushText(x,y,w,h,text,c.fg,12);
  return {x,y,w,h,
    T:{x:x+w/2,y}, B:{x:x+w/2,y:y+h},
    L:{x,y:y+h/2}, R:{x:x+w,y:y+h/2},
    CX:x+w/2, CY:y+h/2};
}

function dia(c,x,y,w,h,text){
  pushDiamond(x,y,w,h,c.bg,c.sk);
  pushText(x,y,w,h,text,c.fg,11);
  return {x,y,w,h,
    T:{x:x+w/2,y}, B:{x:x+w/2,y:y+h},
    L:{x,y:y+h/2}, R:{x:x+w,y:y+h/2},
    CX:x+w/2, CY:y+h/2};
}

function frame(x,y,w,h,title,c){
  pushRect(x,y,w,h,'transparent',c.sk,true);
  pushText(x+2,y-26,w-4,24,title,c.fg,13);
}

function vline(x,y1,y2,color){ // thin vertical separator
  const id=nid();
  ELS.push({
    id,type:'line', x, y:y1,
    points:[[0,0],[0,y2-y1]],
    width:0, height:y2-y1,
    strokeColor:color||'#334155', backgroundColor:'transparent',
    strokeWidth:1, strokeStyle:'dashed', strokeSharpness:'round',
    roughness:0, fillStyle:'solid',
    angle:0, opacity:60, boundElements:[],
    seed:1, version:1, versionNonce:1,
    isDeleted:false, updated:1, link:null, locked:false,
    lastCommittedPoint:null, startArrowhead:null, endArrowhead:null
  });
}

function conn(a,b,color,lbl){ pushArrow(a.B.x,a.B.y,b.T.x,b.T.y,color,lbl); }
function connR(a,b,color){ pushArrow(a.R.x,a.R.y,b.L.x,b.L.y,color); }
function connL(a,b,color,lbl){ pushArrow(a.L.x,a.L.y,b.R.x,b.R.y,color,lbl); }

// ═══════════════════════════════════════════════════
// LAYOUT CONSTANTS
// ═══════════════════════════════════════════════════
// WF1
const W1={
  TL:90, TW:300,  // Temporal column
  BL:420, BW:170, // Branch-ref column
  AL:620, AW:240, // Application column
  get TCX(){ return this.TL+this.TW/2; },
  get ACX(){ return this.AL+this.AW/2; }
};
// WF9 (offset 920 to the right)
const W9={
  TL:90+930, TW:300,
  BL:420+930, BW:170,
  AL:620+930, AW:240,
  get TCX(){ return this.TL+this.TW/2; },
  get ACX(){ return this.AL+this.AW/2; }
};

const GAP=18;  // vertical gap between nodes

// ═══════════════════════════════════════════════════
// WF1 — Entry/Exit Tracking (UPDATED)
// ═══════════════════════════════════════════════════
frame(70, 34, 810, 1200, 'WF1 — Entry / Exit Tracking  (Updated: Quota Check Before Entry)', C.frame1);

// Column headers
box(C.hdrT, W1.TL,40, W1.TW,26, '⚙  TEMPORAL WORKFLOW ENGINE');
box(C.hdrA, W1.AL,40, W1.AW,26, '🖥  APPLICATION / USER VIEW');

let Y=84;

// ── TRIGGER ──
const T1=box(C.trig, W1.TL,Y, W1.TW,82,
  '⚡ TRIGGER\nVehicle card swipes at physical gate\nDevice 14070001 = Gate 1\nDevice 24074151 = Gate 2\nPortNum 1 = Entry event', true);
const T1a=box(C.appB, W1.AL,Y, W1.AW,82,
  '🏢 PHYSICAL GATE SCANNER\nRFID card tap at Cyber Towers\nentrance gate reader\nEvent fires in TimeWatch DB', true);
connR(T1,T1a,'#475569');
Y+=82+GAP;

// ── N1 — Lookup ──
const N1=box(C.act, W1.TL,Y, W1.TW,60,
  '🔍 ACTIVITY · Query Personnel DB\nLookup CardData → get PCode, Name, Company\npersonnelCache.js · 1-min TTL cache');
const N1a=box(C.appB, W1.AL,Y, W1.AW,60,
  '📡 BACKGROUND SYSTEM CHECK\nNothing visible to user yet\nDB lookup: TimeWatch SQL Server\nResult: Authorized or Unauthorized');
conn(T1,N1,'#7c3aed'); connR(N1,N1a,'#475569');
Y+=60+GAP;

// ── N2 — Auth decision ──
const N2=dia(C.dec, W1.TL,Y, W1.TW,78,
  '◇  Is PCode field present?\n(Authorized Vehicle?)');
conn(N1,N2,'#0284c7');
// NO branch ref (right side)
const N2no=box(C.alert, W1.BL,Y+5, W1.BW,68,
  '🚫 NO → Start WF3\nUnauthorized vehicle\nApproval workflow\nSecurity notified', true);
const N2noa=box(C.appR, W1.AL,Y+5, W1.AW,68,
  '🖥 LIVE TABLE\n🔴 "UNAUTHORIZED — [Vehicle]"\nSecurity officer alert popup\nApproval card sent to admin', true);
connL(N2,N2no,'#ef4444','NO');
connR(N2no,N2noa,'#ef4444');
Y+=78+GAP;

// ── N4 — Quota check ──
const N4=dia(C.dec, W1.TL,Y, W1.TW,78,
  '◇  Company Quota Full?\n(occupied >= total slots)');
conn(N2,N4,'#22c55e','YES ↓');
// FULL branch ref
const N4full=box(C.alert, W1.BL,Y+5, W1.BW,68,
  '🔴 FULL → Start WF9\nQuota full denial\n& override workflow\nGate blocked', true);
const N4fulla=box(C.appR, W1.AL,Y+5, W1.AW,68,
  '🖥 LED DISPLAY AT GATE\n"⛔ Company Parking FULL"\n"10/10 slots occupied"\n"Please park outside"', true);
connL(N4,N4full,'#ef4444','FULL');
connR(N4full,N4fulla,'#ef4444');
Y+=78+GAP;

// ── N5 — Allow entry ──
const N5=box(C.ok, W1.TL,Y, W1.TW,65,
  '✅ ACTIVITY · Allow Entry\nSend OPEN signal to gate controller\nGate opens · Log entry in TimeWatch DB\nTimestamp + gate ID recorded');
const N5a=box(C.appG, W1.AL,Y, W1.AW,65,
  '🖥 LED + DASHBOARD\nGate opens: "Welcome! Authorized"\n🟢 Live table: new row added\n[Name] · [Company] · Time');
conn(N4,N5,'#22c55e','NOT FULL ↓'); connR(N5,N5a,'#475569');
Y+=65+GAP;

// ── N6 — Start child workflows ──
const N6=box(C.act, W1.TL,Y, W1.TW,65,
  '🚀 ACTIVITY · Start Child Workflows\n→ WF7: Increment company parking count\n→ WF2: Start 24h overstay durable timer\nBoth run concurrently in parallel');
const N6a=box(C.appG, W1.AL,Y, W1.AW,65,
  '🖥 STATS CARD — DASHBOARD\nParking count updates instantly:\n"4/22" → "5/22"\nAll users see it via WebSocket');
conn(N5,N6,'#0284c7'); connR(N6,N6a,'#475569');
Y+=65+GAP;

// ── N7 — Durable sleep ──
const N7=box(C.timer, W1.TL,Y, W1.TW,68,
  '⏳ DURABLE TIMER · Sleep\nawait sleep(until exit scan detected)\nSurvives server crash & restart\nBackend polls TimeWatch every 3s');
const N7a=box(C.appB, W1.AL,Y, W1.AW,68,
  '🖥 LIVE ENTRY/EXIT TABLE\nVehicle row shows "INSIDE"\nDuration counter ticks live\nReal-time via WebSocket updates');
conn(N6,N7,'#ca8a04'); connR(N7,N7a,'#475569');
Y+=68+GAP;

// ── N8 — Exit detected ──
const N8=box(C.act, W1.TL,Y, W1.TW,70,
  '🚪 ACTIVITY · Exit Detected\nPortNum=2 scan at gate received\nSignal WF7 → decrement company count\nSignal WF2 → cancel overstay timer\nLog exit event with timestamp');
const N8a=box(C.appG, W1.AL,Y, W1.AW,70,
  '🖥 LIVE TABLE + STATS CARD\nRow: "EXITED · 2h 34m inside"\nParking count: "5/22" → "4/22"\nReport session pair auto-created\nDuration calculated');
conn(N7,N8,'#0284c7'); connR(N8,N8a,'#475569');
Y+=70+GAP;

// ── N9 — WF1 End ──
const N9=box(C.ok, W1.TL,Y, W1.TW,52,
  '✅ WF1 COMPLETE\nAudit log entry written · Session recorded');
const N9a=box(C.appG, W1.AL,Y, W1.AW,52,
  '🖥 REPORTS PAGE\nNew entry+exit session row visible\nEntry · Exit · Duration all logged');
conn(N8,N9,'#16a34a'); connR(N9,N9a,'#475569');
Y+=52+GAP;

// ── KEY CHANGE NOTE ──
box(C.note, W1.TL,Y, W1.TW+W1.AW+42,90,
  '📌  KEY CHANGE IN WF1\n\nOLD FLOW:  Authorized vehicle → gate opens immediately\nNEW FLOW: Authorized → check company quota → if FULL → start WF9 (deny entry first)\nThe quota check runs BEFORE the gate opens. No vehicle can enter when company is at full capacity.',
  true);

// Vertical divider between Temporal and App columns
vline(W1.BL-8, 40, Y+90, '#334155');
vline(W1.AL-8, 40, Y+90, '#334155');


// ═══════════════════════════════════════════════════
// WF9 — Parking Quota Full: Denial & Override
// ═══════════════════════════════════════════════════
frame(70+930, 34, 820, 1430,
  'WF9 — Parking Quota Full: Denial & Override Request  (New Workflow)', C.frame9);

box(C.hdrT, W9.TL,40, W9.TW,26, '⚙  TEMPORAL WORKFLOW ENGINE');
box(C.hdrA, W9.AL,40, W9.AW,26, '🖥  APPLICATION / USER VIEW');

let Y9=84;

// ── TRIGGER ──
const T9=box(C.trig, W9.TL,Y9, W9.TW,88,
  '⚡ TRIGGER  (started by WF1)\n\nConditions both must be true:\n① Vehicle IS authorized (PCode present)\n② Company quota IS full (occupied >= total)\n\nGate blocked BEFORE it opens', true);
const T9a=box(C.appR, W9.AL,Y9, W9.AW,88,
  '🚗 VEHICLE AT GATE\nAuthorized employee arrives\nBut company slots are full (e.g. 10/10)\nGate controller receives DENY signal\nbefore vehicle expects it to open', true);
connR(T9,T9a,'#475569');
Y9+=88+GAP;

// ── N91 — Block gate ──
const N91=box(C.alert, W9.TL,Y9, W9.TW,62,
  '🚫 ACTIVITY · Block Gate\nSend DENY signal to gate controller\nGate stays CLOSED\nLog event: ENTRY_DENIED_QUOTA_FULL');
const N91a=box(C.appR, W9.AL,Y9, W9.AW,62,
  '🖥 LED DISPLAY AT GATE\n"⛔ Company Parking FULL  10/10"\n"Your slots are occupied"\n"Please park your vehicle outside"');
conn(T9,N91,'#a855f7'); connR(N91,N91a,'#475569');
Y9+=62+GAP;

// ── N92 — Email Company Admin ──
const N92=box(C.act, W9.TL,Y9, W9.TW,70,
  '📧 ACTIVITY · Email Company Admin\nTo: companyAdmin@company.com\nSubject: Vehicle denied — quota full\nBody: Vehicle [ABC] was denied entry\nat Gate 1 · [Time] · Quota: 10/10');
const N92a=box(C.appR, W9.AL,Y9, W9.AW,70,
  '📨 COMPANY ADMIN EMAIL\n🔴 "Vehicle ABC denied entry"\n"Your company parking is full"\n"10/10 slots occupied at Gate 1"\nTimestamp · Vehicle details included');
conn(N91,N92,'#0284c7'); connR(N92,N92a,'#475569');
Y9+=70+GAP;

// ── N93 — Audit log ──
const N93=box(C.act, W9.TL,Y9, W9.TW,52,
  '📋 ACTIVITY · Write Audit Log\nEvent: ENTRY_DENIED_QUOTA_FULL\nVehicle · Company · Gate · Time stored');
const N93a=box(C.appB, W9.AL,Y9, W9.AW,52,
  '🖥 ALERTS PANEL — DASHBOARD\n"Denied — Quota Full" card visible\nAll dashboard admins can see');
conn(N92,N93,'#0284c7'); connR(N93,N93a,'#475569');
Y9+=52+GAP;

// ── N94 — Wait for override signal ──
const N94=box(C.timer, W9.TL,Y9, W9.TW,68,
  '⏳ DURABLE WAIT (up to 5 minutes)\nawait waitForSignal("override-request")\n   OR  sleep("5 minutes") → timeout\nListening: did employee request override?');
const N94a=box(C.appW, W9.AL,Y9, W9.AW,68,
  '🖥 SECURITY DESK TERMINAL\nSecurity officer sees denial alert\n[Request Override] button appears\nEmployee tells officer: "I need to enter"\n5-minute window is active');
conn(N93,N94,'#ca8a04'); connR(N94,N94a,'#475569');
Y9+=68+GAP;

// ── N95 — Override requested? ──
const N95=dia(C.dec, W9.TL,Y9, W9.TW,78,
  '◇  Override Requested\nwithin 5 minutes?');
conn(N94,N95,'#ca8a04');
// NO → end quietly (right side branch)
const N95no=box(C.ok, W9.BL,Y9+5, W9.BW,68,
  '✅ ENDS QUIETLY\nNo override requested\nVehicle parks outside\nAudit: no action needed', true);
const N95noa=box(C.appB, W9.AL,Y9+5, W9.AW,68,
  '🖥 AUDIT LOG\n"Denied — vehicle parked outside"\n"No override was requested"\nCase closed automatically', true);
connL(N95,N95no,'#22c55e','NO');
connR(N95no,N95noa,'#22c55e');
Y9+=78+GAP;

// ── N96 — Send override request ──
const N96=box(C.act, W9.TL,Y9, W9.TW,72,
  '📧 ACTIVITY · Send Override Request\nTo: companyAdmin@company.com\nSubject: Approve urgent entry for [Vehicle]?\nBody: Employee needs to enter. Slots full.\nButtons: [Approve] [Deny]');
const N96a=box(C.appW, W9.AL,Y9, W9.AW,72,
  '📨 COMPANY ADMIN NOTIFICATION\n⚠ "Override Request Received"\n"Vehicle ABC needs urgent entry"\n"Company quota full (10/10)"\n[Approve Entry] [Deny Entry] buttons');
conn(N95,N96,'#f59e0b','YES ↓'); connR(N96,N96a,'#475569');
Y9+=72+GAP;

// ── N97 — Wait for admin signal ──
const N97=box(C.timer, W9.TL,Y9, W9.TW,65,
  '⏳ DURABLE WAIT (5 minutes)\nawait waitForSignal("admin-decision")\n   OR  sleep("5 minutes") → auto-deny\nAdmin must respond within 5 min');
const N97a=box(C.appW, W9.AL,Y9, W9.AW,65,
  '🖥 ADMIN DASHBOARD / EMAIL\n[Approve Entry] [Deny Entry] buttons\n5-minute countdown shown to admin\nPush notification sent\nNo response = auto-denied');
conn(N96,N97,'#0284c7'); connR(N97,N97a,'#475569');
Y9+=65+GAP;

// ── N98 — Admin decision ──
const N98=dia(C.dec, W9.TL,Y9, W9.TW,78,
  '◇  Admin Decision?\nApproved / Denied / Timeout');
conn(N97,N98,'#ca8a04');
// DENIED branch ref
const N98den=box(C.alert, W9.BL,Y9+5, W9.BW,68,
  '❌ DENIED / TIMEOUT\nGate stays CLOSED\nDenial email sent\nAudit: OVERRIDE_DENIED', true);
const N98dena=box(C.appR, W9.AL,Y9+5, W9.AW,68,
  '🖥 SECURITY DESK\n"Override denied by admin"\n"Vehicle ABC must park outside"\nCase closed · Audit log entry', true);
connL(N98,N98den,'#ef4444','DENIED');
connR(N98den,N98dena,'#ef4444');
Y9+=78+GAP;

// ── N99 — Approved: open gate ──
const N99=box(C.act, W9.TL,Y9, W9.TW,72,
  '✅ ACTIVITY · Approved — Open Gate\nSend OPEN signal to gate controller\nLog as: OVERRIDE_APPROVED\nRecord count: 11/10 (over quota)\nApprover ID + timestamp stored');
const N99a=box(C.appG, W9.AL,Y9, W9.AW,72,
  '🖥 LED + LIVE TABLE + DASHBOARD\nGate opens: "Override granted — Welcome"\nLive table: row added\n🟡 "OVERRIDE APPROVED" badge\nCount shows: 11/10  ⚠ over quota');
conn(N98,N99,'#22c55e','APPROVED ↓'); connR(N99,N99a,'#475569');
Y9+=72+GAP;

// ── N100 — Confirmation emails ──
const N100=box(C.act, W9.TL,Y9, W9.TW,55,
  '📧 ACTIVITY · Send Confirmation Emails\nTo Admin: "Override approved for Vehicle ABC"\nTo Security Desk: "Entry granted at [Time]"');
const N100a=box(C.appG, W9.AL,Y9, W9.AW,55,
  '📨 CONFIRMATIONS SENT\nAdmin receives approval confirmation\nSecurity desk notified of entry\nFull audit trail recorded');
conn(N99,N100,'#22c55e'); connR(N100,N100a,'#475569');
Y9+=55+GAP;

// ── N101 — WF9 End (approved path) ──
const N101=box(C.ok, W9.TL,Y9, W9.TW,48,
  '✅ WF9 COMPLETE — Override Approved Path');
const N101a=box(C.appG, W9.AL,Y9, W9.AW,48,
  '🖥 REPORTS · Entry logged as override');
conn(N100,N101,'#16a34a'); connR(N101,N101a,'#475569');
